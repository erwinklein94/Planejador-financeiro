<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EK FINANCE PRO — Sidebar Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
    --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --text-light: #64748b;
    --primary: #2ab5b2; --primary-dark: #1e8a87; --accent: #8b5cf6;
    --border: #e2e8f0; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    --danger: #ef4444; --success: #22c55e;
    --sidebar-width: 260px;
}

[data-theme="dark"] {
    --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --text-light: #94a3b8;
    --border: #334155; --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; transition: all 0.3s ease; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }

/* --- SIDEBAR LOGIC --- */
.sidebar {
    position: fixed; top: 0; left: -260px; width: var(--sidebar-width); height: 100%;
    background: var(--card); border-right: 1px solid var(--border); z-index: 1000;
    display: flex; flex-direction: column; box-shadow: var(--shadow);
}
.sidebar.open { left: 0; }

.sidebar-header { padding: 20px; background: var(--primary); color: white; display: flex; align-items: center; justify-content: space-between; }

.nav-links { flex: 1; padding: 20px 0; }
.nav-item { 
    padding: 15px 25px; cursor: pointer; display: flex; align-items: center; gap: 12px;
    font-weight: 600; color: var(--text-light); border-left: 4px solid transparent;
}
.nav-item:hover { background: rgba(42,181,178,0.1); color: var(--primary); }
.nav-item.active { background: rgba(42,181,178,0.1); color: var(--primary); border-left-color: var(--primary); }

/* --- MAIN CONTENT ADJUSTMENT --- */
.main-wrapper { margin-left: 0; padding: 20px; transition: margin 0.3s; }
.top-bar { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }

/* Botão Flutuante / Hambúrguer */
.menu-toggle {
    background: var(--primary); color: white; border: none; padding: 10px;
    border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 5px;
}

/* --- UI COMPONENTS (CARDS, GRIDS, ETC) --- */
.card { background: var(--card); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; box-shadow: var(--shadow); border: 1px solid var(--border); }
.grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.field label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 0.5rem; color: var(--text-light); }
input { width: 100%; padding: 0.75rem; border: 1.5px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font-size: 1rem; }
.stat-card { text-align: center; padding: 1.5rem; border-radius: 12px; border: 2px solid var(--primary); background: rgba(42,181,178,0.05); }
.stat-value { font-family: 'Space Mono', monospace; font-size: 1.8rem; font-weight: 700; }

.btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
.btn-export { background: var(--accent); color: white; width: 100%; }

.hidden { display: none; }
.overlay { 
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
    background: rgba(0,0,0,0.5); z-index: 999; display: none; 
}
.overlay.active { display: block; }

@media (min-width: 1024px) {
    .sidebar { left: 0; }
    .main-wrapper { margin-left: var(--sidebar-width); }
    .menu-toggle, .overlay { display: none; }
}
</style>
</head>
<body data-theme="light">

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <span style="font-family:'Space Mono'; font-weight: bold;">EK FINANCE</span>
        <button onclick="toggleSidebar()" style="background:none; border:none; color:white; cursor:pointer;" class="mobile-only">✕</button>
    </div>
    <nav class="nav-links">
        <div class="nav-item active" onclick="showTab(0)">📝 Lançamentos</div>
        <div class="nav-item" onclick="showTab(1)">⚖️ Comparativo</div>
        <div class="nav-item" onclick="showTab(2)">📈 Dashboard</div>
        <div class="nav-item" onclick="showTab(3)">🚀 Simulador</div>
    </nav>
    <div style="padding: 20px;">
        <button class="btn" style="width:100%; background:var(--border); color:var(--text)" onclick="toggleTheme()">🌓 Alternar Tema</button>
    </div>
</aside>

<main class="main-wrapper">
    <div class="top-bar">
        <button class="menu-toggle" onclick="toggleSidebar()">☰ Menu</button>
        <h2 id="page-title">Lançamentos</h2>
    </div>

    <div class="tab-content" id="tab0">
        <div class="grid">
            <div class="card">
                <label style="color:var(--primary); font-weight:bold">💰 RECEITAS</label>
                <div class="field" style="margin-top:10px">
                    <label>Salário Bruto</label>
                    <input type="text" id="r_bruto" data-type="money" placeholder="R$ 0,00">
                </div>
                <div class="grid" style="grid-template-columns: 1fr 1fr; margin-top:10px">
                    <div class="field"><label>Dependentes</label><input type="number" id="r_dep" value="0" min="0"></div>
                    <div class="field"><label>Pensão</label><input type="text" id="r_pensao" data-type="money"></div>
                </div>
            </div>

            <div class="card">
                <label style="color:var(--danger); font-weight:bold">💸 DESPESAS</label>
                <div class="grid" style="grid-template-columns: 1fr 1fr; margin-top:10px">
                    <div class="field"><label>Aluguel</label><input type="text" id="r_aluguel" data-type="money"></div>
                    <div class="field"><label>Mercado</label><input type="text" id="r_mercado" data-type="money"></div>
                    <div class="field"><label>Faxina ✨</label><input type="text" id="r_faxina" data-type="money"></div>
                    <div class="field"><label>Outros</label><input type="text" id="r_outros" data-type="money"></div>
                </div>
            </div>
        </div>
        
        <div class="stat-card" style="margin-top:20px">
            <label style="font-size: 0.8rem; letter-spacing: 1px;">SALDO DISPONÍVEL</label>
            <div class="stat-value" id="res_saldo">R$ 0,00</div>
        </div>
    </div>

    <div class="tab-content hidden" id="tab1">
        <div class="card" id="compare_table">
            <p>Os dados aparecerão conforme você preenche os lançamentos.</p>
        </div>
        <button class="btn btn-export" onclick="exportCSV()">📥 Baixar Relatório CSV</button>
    </div>

    <div class="tab-content hidden" id="tab2">
        <div class="grid">
            <div class="card">
                <label>Composição de Gastos</label>
                <div style="height: 300px;"><canvas id="chartDoughnut"></canvas></div>
            </div>
            <div class="card">
                <label>Renda vs. Despesas</label>
                <div style="height: 300px;"><canvas id="chartBar"></canvas></div>
            </div>
        </div>
    </div>

    <div class="tab-content hidden" id="tab3">
        <div class="card">
            <p style="margin-bottom: 20px;">Investimento automático baseado no <strong>Saldo Disponível</strong>.</p>
            <div class="grid">
                <div class="field"><label>Aporte Mensal</label><input type="text" id="sim_aporte" readonly style="opacity: 0.7"></div>
                <div class="field"><label>Juros Anuais (%)</label><input type="number" id="sim_juros" value="12"></div>
                <div class="field"><label>Anos</label><input type="number" id="sim_anos" value="10"></div>
            </div>
            <div class="stat-card" style="margin-top:30px; border-color: var(--accent);">
                <label style="color:var(--accent)">PATRIMÔNIO FINAL</label>
                <div class="stat-value" id="sim_resultado" style="color:var(--accent)">R$ 0,00</div>
            </div>
        </div>
    </div>
</main>

<script>
let charts = {};

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('active');
}

function showTab(idx) {
    const titles = ["Lançamentos", "Comparativo", "Dashboard", "Simulador"];
    document.getElementById('page-title').innerText = titles[idx];
    
    document.querySelectorAll('.nav-item').forEach((t, i) => t.classList.toggle('active', i === idx));
    document.querySelectorAll('.tab-content').forEach((t, i) => t.classList.toggle('hidden', i !== idx));
    
    if(window.innerWidth < 1024) toggleSidebar();
    if(idx === 2) renderCharts();
    if(idx === 3) runSimulation();
}

// Lógica Financeira (Reutilizada e Protegida contra negativos)
const parse = v => Math.max(0, parseFloat(v.replace(/\D/g, '')) / 100 || 0);
const fmt = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

function calculate() {
    const bruto = parse(document.getElementById('r_bruto').value);
    const dep = parseInt(document.getElementById('r_dep').value) || 0;
    const pensao = parse(document.getElementById('r_pensao').value);
    
    // IRRF/INSS Estimado
    const desc = bruto * 0.20; // Estimativa rápida de impostos
    const liquido = bruto - desc - (dep * 189) - pensao;

    const gastos = ['r_aluguel', 'r_mercado', 'r_faxina', 'r_outros']
        .reduce((acc, id) => acc + parse(document.getElementById(id).value), 0);

    const saldo = liquido - gastos;
    const elSaldo = document.getElementById('res_saldo');
    elSaldo.innerText = fmt(saldo);
    elSaldo.style.color = saldo < 0 ? 'var(--danger)' : 'var(--success)';
    
    document.getElementById('sim_aporte').value = fmt(Math.max(0, saldo));
}

function renderCharts() {
    const ctxD = document.getElementById('chartDoughnut').getContext('2d');
    const ctxB = document.getElementById('chartBar').getContext('2d');
    
    const gastosValues = [
        parse(document.getElementById('r_aluguel').value),
        parse(document.getElementById('r_mercado').value),
        parse(document.getElementById('r_faxina').value),
        parse(document.getElementById('r_outros').value)
    ];

    if(charts.d) charts.d.destroy();
    charts.d = new Chart(ctxD, {
        type: 'doughnut',
        data: {
            labels: ['Aluguel', 'Mercado', 'Faxina', 'Outros'],
            datasets: [{ data: gastosValues, backgroundColor: ['#2ab5b2', '#8b5cf6', '#f59e0b', '#ef4444'] }]
        },
        options: { maintainAspectRatio: false }
    });
}

function toggleTheme() {
    const body = document.body;
    const current = body.getAttribute('data-theme');
    body.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
}

// Máscara e Eventos
document.querySelectorAll('[data-type="money"]').forEach(input => {
    input.addEventListener('input', e => {
        let v = e.target.value.replace(/\D/g, '');
        v = (v / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
        e.target.value = v ? 'R$ ' + v : '';
        calculate();
    });
});

function runSimulation() {
    const aporte = parse(document.getElementById('sim_aporte').value);
    const taxa = parseFloat(document.getElementById('sim_juros').value) / 100 / 12;
    const meses = parseInt(document.getElementById('sim_anos').value) * 12;
    let total = 0;
    for(let i=0; i<meses; i++) total = (total + aporte) * (1 + taxa);
    document.getElementById('sim_resultado').innerText = fmt(total);
}

function exportCSV() {
    let csv = "Categoria;Valor\nSaldo Disponivel;" + document.getElementById('res_saldo').innerText;
    const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "finance_pro.csv";
    link.click();
}
</script>
</body>
</html>
