<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planejador Financeiro Pro — EK</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#f0f4f8;--card:#fff;--primary:#2ab5b2;--primary-dark:#1e9e9b;--accent:#f5a623;--coral:#f06868;--blue:#4a90d9;
--text:#2d3748;--text-light:#718096;--border:#e2e8f0;--success:#48bb78;--danger:#f56565;--warning:#ecc94b;
--shadow:0 2px 12px rgba(0,0,0,.08);--radius:12px;--purple:#805ad5;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app-header{background:linear-gradient(135deg,#2ab5b2,#1a8a87);padding:20px 32px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(42,181,178,.3)}
.app-header h1{color:#fff;font-family:'Space Mono',monospace;font-size:1.4rem;letter-spacing:-0.5px}
.app-header span{color:rgba(255,255,255,.8);font-size:.85rem}
.tabs{display:flex;background:#fff;border-bottom:3px solid var(--primary);overflow-x:auto}
.tab{padding:14px 20px;cursor:pointer;font-weight:600;font-size:.82rem;color:var(--text-light);border:none;background:none;transition:.2s;white-space:nowrap;position:relative}
.tab:hover{color:var(--primary)}
.tab.active{color:#fff;background:var(--primary)}
.tab.active::after{content:'';position:absolute;bottom:-3px;left:0;right:0;height:3px;background:var(--accent)}
.content{max-width:1200px;margin:0 auto;padding:24px}
.section-title{font-family:'Space Mono',monospace;font-size:1.05rem;color:var(--primary-dark);margin:24px 0 16px;padding-bottom:8px;border-bottom:3px solid var(--primary);display:flex;align-items:center;justify-content:space-between}
.section-title div{display:flex;align-items:center;gap:10px}
.section-title .icon{width:28px;height:28px;background:var(--primary);color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border-left:4px solid var(--primary);transition:transform .15s}
.card.accent{border-left-color:var(--accent)}.card.coral{border-left-color:var(--coral)}.card.blue{border-left-color:var(--blue)}.card.purple{border-left-color:var(--purple)}
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr 1fr}.grid-4{grid-template-columns:1fr 1fr 1fr 1fr}.grid-5{grid-template-columns:1fr 1fr 1fr 1fr 1fr}
@media(max-width:768px){.grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.75rem;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px}
.field input,.field select{padding:10px 12px;border:2px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.92rem;transition:.2s;background:#fafbfc}
.field input:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(42,181,178,.15)}
.field input[readonly]{background:#e8f5f5;color:var(--primary-dark);cursor:default;font-weight:600;border-color:#b2dfdb}
.btn{padding:10px 20px;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;transition:.2s;font-size:.85rem;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:#e09515}
.btn-pdf{background:#e74c3c;color:#fff}.btn-pdf:hover{background:#c0392b}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:16px 0}
.summary-box{background:#fff;border-radius:var(--radius);padding:18px;text-align:center;box-shadow:var(--shadow);border-top:4px solid var(--primary)}
.summary-box .value{font-family:'Space Mono',monospace;font-size:1.3rem;font-weight:700;margin-top:4px}
.chart-container{background:#fff;border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);height:300px;display:flex;justify-content:center;align-items:center}
.hidden{display:none}
.inv-item,.loan-item,.extra-item{background:#f7fafc;border-radius:8px;padding:14px;margin-bottom:10px;border:1px solid var(--border);position:relative}
.remove-btn{position:absolute;top:8px;right:8px;background:var(--coral);color:#fff;border:none;width:24px;height:24px;border-radius:50%;cursor:pointer}
.compare-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);align-items:center;font-size:.88rem}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-success{background:#c6f6d5;color:#276749}.badge-danger{background:#fed7d7;color:#9b2c2c}.badge-warning{background:#fefcbf;color:#975a16}
</style>
</head>
<body>
<div class="app-header"><h1>💰 Planejador Financeiro Pro</h1><button class="btn btn-pdf btn-sm" onclick="exportPDF()">📄 Gerar Relatório PDF</button></div>
<div class="tabs">
<div class="tab active" onclick="showTab(0)">📋 Plano Ideal</div>
<div class="tab" onclick="showTab(1)">📊 Plano Real</div>
<div class="tab" onclick="showTab(2)">⚖️ Comparativo</div>
<div class="tab" onclick="showTab(3)">🔍 Análise</div>
<div class="tab" onclick="showTab(4)">🎯 Caixinhas</div>
<div class="tab" onclick="showTab(5)">🧮 Simulador</div>
</div>

<div class="content">
<div class="tab-content" id="tab0">
    <div class="summary-grid" id="ideal-summary"></div>
    <div class="section-title"><div><span class="icon">$</span> Salários & Deduções — Titular</div></div>
    <div class="card">
        <div class="grid grid-4">
            <div class="field"><label>Salário Bruto</label><input type="text" data-field="i_sal" data-type="money" placeholder="R$ 0,00"></div>
            <div class="field"><label>Dependentes</label><input type="number" data-field="i_dep" value="0" min="0"></div>
            <div class="field"><label>Pensão Alimentícia</label><input type="text" data-field="i_pensao" data-type="money" placeholder="R$ 0,00"></div>
            <div class="field"><label>Salário Líquido (auto)</label><input type="text" id="i_sal_liq" readonly></div>
        </div>
        <div class="grid grid-3" style="margin-top:10px">
            <div class="field"><label>INSS (auto)</label><input type="text" id="i_sal_inss" readonly></div>
            <div class="field"><label>IRRF (auto)</label><input type="text" id="i_sal_irrf" readonly></div>
            <div class="field"><label>Vale-Alimentação</label><input type="text" data-field="i_va" data-type="money" placeholder="R$ 0,00"></div>
        </div>
    </div>

    <div class="section-title"><div><span class="icon" style="background:var(--coral)">📤</span> Distribuição de Gastos</div></div>
    <div class="grid grid-2">
        <div class="card coral">
            <div class="grid grid-2">
                <div class="field"><label>Aluguel/Financ.</label><input type="text" data-field="i_aluguel" data-type="money" placeholder="R$ 0,00"></div>
                <div class="field"><label>Mercado</label><input type="text" data-field="i_mercado" data-type="money" placeholder="R$ 0,00"></div>
                <div class="field"><label>Luz/Água/Internet</label><input type="text" data-field="i_contas" data-type="money" placeholder="R$ 0,00"></div>
                <div class="field"><label>Transporte</label><input type="text" data-field="i_transp" data-type="money" placeholder="R$ 0,00"></div>
            </div>
        </div>
        <div class="chart-container">
            <canvas id="idealChart"></canvas>
        </div>
    </div>
</div>

<div class="tab-content hidden" id="tab1">
    <div class="summary-grid" id="real-summary"></div>
    <div class="section-title"><div><span class="icon">$</span> Salários & Deduções — Real</div></div>
    <div class="card">
        <div class="grid grid-4">
            <div class="field"><label>Salário Bruto</label><input type="text" data-field="r_sal" data-type="money" placeholder="R$ 0,00"></div>
            <div class="field"><label>Dependentes</label><input type="number" data-field="r_dep" value="0" min="0"></div>
            <div class="field"><label>Pensão Alimentícia</label><input type="text" data-field="r_pensao" data-type="money" placeholder="R$ 0,00"></div>
            <div class="field"><label>Salário Líquido (auto)</label><input type="text" id="r_sal_liq" readonly></div>
        </div>
    </div>
    <div class="grid grid-2">
        <div class="card coral">
            <div class="grid grid-2">
                <div class="field"><label>Aluguel/Financ.</label><input type="text" data-field="r_aluguel" data-type="money" placeholder="R$ 0,00"></div>
                <div class="field"><label>Mercado</label><input type="text" data-field="r_mercado" data-type="money" placeholder="R$ 0,00"></div>
                <div class="field"><label>Luz/Água/Internet</label><input type="text" data-field="r_contas" data-type="money" placeholder="R$ 0,00"></div>
                <div class="field"><label>Transporte</label><input type="text" data-field="r_transp" data-type="money" placeholder="R$ 0,00"></div>
            </div>
        </div>
        <div class="chart-container">
            <canvas id="realChart"></canvas>
        </div>
    </div>
</div>

<div class="tab-content hidden" id="tab2"><div id="compare-table"></div></div>
<div class="tab-content hidden" id="tab3"><div id="analysis-bad"></div><div id="analysis-good"></div></div>
<div class="tab-content hidden" id="tab5">
    <div class="card">
        <div class="grid grid-3">
            <div class="field"><label>Investimento Inicial</label><input type="text" id="sim_inicial" data-type="money"></div>
            <div class="field"><label>Aporte Mensal</label><input type="text" id="sim_aporte" data-type="money"></div>
            <div class="field"><label>Taxa % (a.m.)</label><input type="number" id="sim_taxa" step="0.1"></div>
        </div>
        <button class="btn btn-primary" onclick="runSim()" style="margin-top:10px">Simular Crescimento</button>
    </div>
    <div class="chart-container" style="height:400px; margin-top:20px">
        <canvas id="simChart"></canvas>
    </div>
</div>
</div>

<script>
const D = { i_dep: 0, r_dep: 0 };
let charts = {};

const fmt = v => 'R$ ' + (v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const parse = s => { if (!s) return 0; return parseFloat(s.toString().replace(/[R$\s.]/g, '').replace(',', '.')) || 0; };

function moneyMask(el) {
    let v = el.value.replace(/\D/g, '');
    v = (parseInt(v || '0') / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
    el.value = 'R$ ' + v;
}

document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.type === 'money') moneyMask(el);
    const k = el.dataset.field || el.id;
    if (k) {
        D[k] = el.dataset.type === 'money' ? parse(el.value) : el.value;
        recalc();
    }
});

function showTab(n) {
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === n));
    document.querySelectorAll('.tab-content').forEach((t, i) => t.classList.toggle('hidden', i !== n));
}

// CÁLCULO IRRF ATUALIZADO (Deduções de dependentes e pensão)
function calcIRRF(bruto, inss, dependentes = 0, pensao = 0) {
    const deducaoDependente = dependentes * 189.59;
    const base = bruto - inss - deducaoDependente - pensao;
    if (base <= 2259.20) return 0;
    if (base <= 2826.65) return base * .075 - 169.44;
    if (base <= 3751.05) return base * .15 - 381.44;
    if (base <= 4664.68) return base * .225 - 662.77;
    return base * .275 - 896.00;
}

function calcINSS(b) {
    if (b <= 1412) return b * 0.075;
    if (b <= 2666.68) return b * 0.09 - 21.18;
    if (b <= 4000.03) return b * 0.12 - 101.18;
    if (b <= 7786.02) return b * 0.14 - 181.18;
    return 908.85;
}

function updateSalaries(p) {
    const bruto = D[p + '_sal'] || 0;
    const dep = parseInt(D[p + '_dep'] || 0);
    const pensao = D[p + '_pensao'] || 0;
    
    const inss = calcINSS(bruto);
    const irrf = calcIRRF(bruto, inss, dep, pensao);
    const liq = bruto - inss - irrf;

    document.getElementById(p + '_sal_inss').value = fmt(inss);
    document.getElementById(p + '_sal_irrf').value = fmt(irrf);
    document.getElementById(p + '_sal_liq').value = fmt(liq);
    return liq;
}

function updateCharts(p, data) {
    const ctx = document.getElementById(p + 'Chart').getContext('2d');
    if (charts[p]) charts[p].destroy();
    
    charts[p] = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Aluguel', 'Mercado', 'Contas', 'Transporte', 'Investimento'],
            datasets: [{
                data: [data.aluguel, data.mercado, data.contas, data.transp, Math.max(0, data.saldo)],
                backgroundColor: ['#f06868', '#f5a623', '#4a90d9', '#805ad5', '#48bb78']
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
}

function recalc() {
    ['i', 'r'].forEach(p => {
        const liq = updateSalaries(p);
        const gastos = (D[p + '_aluguel'] || 0) + (D[p + '_mercado'] || 0) + (D[p + '_contas'] || 0) + (D[p + '_transp'] || 0);
        const saldo = liq - gastos;
        
        document.getElementById(p + '-summary').innerHTML = `
            <div class="summary-box"><div>Renda Líquida</div><div class="value">${fmt(liq)}</div></div>
            <div class="summary-box coral"><div>Gastos</div><div class="value">${fmt(gastos)}</div></div>
            <div class="summary-box success"><div>Sobra/Investimento</div><div class="value">${fmt(saldo)}</div></div>
        `;

        updateCharts(p === 'i' ? 'ideal' : 'real', {
            aluguel: D[p + '_aluguel'], mercado: D[p + '_mercado'], 
            contas: D[p + '_contas'], transp: D[p + '_transp'], saldo: saldo
        });
    });
}

// SIMULADOR COM GRÁFICO DE LINHA
function runSim() {
    const ini = parse(document.getElementById('sim_inicial').value);
    const ap = parse(document.getElementById('sim_aporte').value);
    const taxa = parseFloat(document.getElementById('sim_taxa').value) / 100;
    
    let saldo = ini;
    let labels = [];
    let valores = [];

    for (let i = 0; i <= 12; i++) {
        labels.push('Mês ' + i);
        valores.push(saldo);
        saldo = (saldo + ap) * (1 + taxa);
    }

    const ctx = document.getElementById('simChart').getContext('2d');
    if (charts['sim']) charts['sim'].destroy();
    charts['sim'] = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Evolução do Patrimônio',
                data: valores,
                borderColor: '#2ab5b2',
                tension: 0.3,
                fill: true,
                backgroundColor: 'rgba(42, 181, 178, 0.1)'
            }]
        }
    });
}

// EXPORTAÇÃO PDF
async function exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    doc.setFont("helvetica", "bold");
    doc.text("Relatório Financeiro Pessoal", 20, 20);
    
    const res = [
        ["Categoria", "Plano Ideal", "Plano Real"],
        ["Salário Líquido", fmt(parse(document.getElementById('i_sal_liq').value)), fmt(parse(document.getElementById('r_sal_liq').value))],
        ["Mercado", fmt(D.i_mercado), fmt(D.r_mercado)],
        ["Aluguel/Moradia", fmt(D.i_aluguel), fmt(D.r_aluguel)],
        ["Contas Fixas", fmt(D.i_contas), fmt(D.r_contas)]
    ];

    doc.autoTable({
        startY: 30,
        head: [res[0]],
        body: res.slice(1),
        theme: 'striped'
    });

    doc.save("meu-planejamento.pdf");
}

window.onload = recalc;
</script>
</body>
</html>
