<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planejador Financeiro EK</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
--bg:#f0f4f8;
--card:#fff;
--text:#2d3748;
--primary:#2ab5b2;
}

body{
font-family:Arial;
background:var(--bg);
color:var(--text);
margin:0;
}

body.dark{
--bg:#1a202c;
--card:#2d3748;
--text:#edf2f7;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:220px;
height:100%;
background:#2d3748;
color:#fff;
padding:20px;
}

.sidebar button{
display:block;
width:100%;
margin-bottom:10px;
}

.content{
margin-left:240px;
padding:20px;
}

.card{
background:var(--card);
padding:15px;
margin-bottom:10px;
border-radius:10px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

@media(max-width:600px){
.content{margin-left:0}
.grid{grid-template-columns:1fr}
}

</style>
</head>

<body>

<div class="sidebar">
<button onclick="showTab('ideal')">Plano Ideal</button>
<button onclick="showTab('real')">Plano Real</button>
<button onclick="showTab('graficos')">Gráficos</button>
<button onclick="showTab('juros')">Juros Compostos</button>
<button onclick="showTab('fin')">Financiamento</button>
<button onclick="toggleTheme()">🌙 Tema</button>
</div>

<div class="content">

<!-- IDEAL -->
<div id="ideal" class="tab">

<div class="card">
<h3>Renda</h3>

<div class="grid">
<input id="i_sal" placeholder="Salário bruto">
<input id="i_va" placeholder="VA">
<input id="i_bonus" placeholder="Bônus">
</div>

<p id="i_result"></p>
</div>

<div class="card">
<h3>Gastos</h3>

<div class="grid">
<input id="i_aluguel" placeholder="Aluguel">
<input id="i_mercado" placeholder="Mercado">
<input id="i_faxina" placeholder="Faxina">
</div>
</div>

</div>

<!-- REAL -->
<div id="real" class="tab" style="display:none">

<div class="card">
<h3>Renda</h3>

<div class="grid">
<input id="r_sal" placeholder="Salário bruto">
<input id="r_va" placeholder="VA">
<input id="r_bonus" placeholder="Bônus">
</div>

<p id="r_result"></p>
</div>

<div class="card">
<h3>Gastos</h3>

<div class="grid">
<input id="r_aluguel">
<input id="r_mercado">
<input id="r_faxina">
<input id="r_viver" placeholder="Quanto quero viver">
</div>

</div>

<div class="card">
<h3>Sobra</h3>
<p id="r_sobra"></p>
</div>

</div>

<!-- GRÁFICOS -->
<div id="graficos" class="tab" style="display:none">
<canvas id="grafico"></canvas>
</div>

<!-- JUROS -->
<div id="juros" class="tab" style="display:none">

<div class="card">
<input id="aporte" placeholder="Aporte mensal">
<button onclick="simular()">Simular</button>
</div>

<p id="resultadoJuros"></p>

</div>

<!-- FINANCIAMENTO -->
<div id="fin" class="tab" style="display:none">

<div class="card">
<input id="fin_valor" placeholder="Valor">
<input id="fin_entrada" placeholder="Entrada">
<input id="fin_taxa" placeholder="Taxa">

<button onclick="calcFin()">Simular</button>

<p id="fin_res"></p>

</div>

</div>

</div>

<script>

function parse(v){
return Math.max(0, Number(v) || 0);
}

function showTab(id){
document.querySelectorAll('.tab').forEach(t=>t.style.display='none');
document.getElementById(id).style.display='block';
update();
}

function toggleTheme(){
document.body.classList.toggle('dark');
}

function update(){

// IDEAL
const i_sal=parse(i_sal.value);
const i_va=parse(i_va.value);
const i_bonus=parse(i_bonus.value);

const i_total=i_sal+i_va;
i_result.innerText="Renda: "+i_total+" | Bônus: "+i_bonus;

// REAL
const r_sal=parse(r_sal.value);
const r_va=parse(r_va.value);
const r_bonus=parse(r_bonus.value);

const r_aluguel=parse(r_aluguel.value);
const r_mercado=parse(r_mercado.value);
const r_faxina=parse(r_faxina.value);
const r_viver=parse(r_viver.value);

const renda=r_sal+r_va;
const gastos=r_aluguel+r_mercado+r_faxina;

const sobra=renda-gastos-r_viver;

r_result.innerText="Renda: "+renda+" | Bônus: "+r_bonus;
r_sobra.innerText="Sobra: "+sobra;

// gráfico
new Chart(document.getElementById('grafico'),{
type:'bar',
data:{
labels:['Ideal','Real'],
datasets:[{
data:[i_total,renda]
}]
}
});

window.sobraGlobal=sobra;

}

function simular(){
const aporte=parse(aporte.value) || window.sobraGlobal || 0;
resultadoJuros.innerText="Aporte usado: "+aporte;
}

function calcFin(){
const valor=parse(fin_valor.value);
const entrada=parse(fin_entrada.value);
const taxa=parse(fin_taxa.value)/100;

const parcela=(valor-entrada)*taxa;

if(parcela < window.sobraGlobal){
fin_res.innerText="✅ Cabe no orçamento";
}else{
fin_res.innerText="❌ Não cabe";
}
}

document.querySelectorAll('input').forEach(i=>{
i.addEventListener('input',update);
});

</script>

</body>
</html>
