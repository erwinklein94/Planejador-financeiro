<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Planejador Financeiro Pro — EK</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#f0f4f8; --card:#fff; --primary:#2ab5b2; --primary-dark:#1e9e9b; --accent:#f5a623; --coral:#f06868; --blue:#4a90d9;
      --text:#2d3748; --text-light:#718096; --border:#e2e8f0; --success:#48bb78; --danger:#f56565; --warning:#ecc94b;
      --shadow:0 2px 12px rgba(0,0,0,.08); --radius:12px; --purple:#805ad5; --menu-width:260px;
    }
    body.dark{
      --bg:#121826; --card:#1e2432; --primary:#2ab5b2; --primary-dark:#249f9c; --accent:#f5a623; --coral:#f06868; --blue:#4a90d9;
      --text:#e2e8f0; --text-light:#9aa3b2; --border:#2d3748; --shadow:0 4px 12px rgba(0,0,0,0.3);
    }
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition: background .2s, color .2s;}
    .app-wrapper{display:flex;min-height:100vh}
    .menu-toggle{position:fixed;top:16px;left:16px;z-index:100;background:var(--primary);color:white;border:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 8px rgba(0,0,0,0.2);transition:.2s;}
    .menu-toggle:hover{background:var(--primary-dark)}
    .side-menu{position:fixed;left:0;top:0;width:var(--menu-width);height:100%;background:var(--card);box-shadow:2px 0 12px rgba(0,0,0,0.05);padding:24px 0;transform:translateX(-100%);transition:transform 0.25s ease;z-index:90;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
    .side-menu.open{transform:translateX(0)}
    .menu-header{padding:20px 24px;border-bottom:1px solid var(--border);margin-bottom:12px}
    .menu-header h2{font-family:'Space Mono',monospace;color:var(--primary);font-size:1.2rem}
    .menu-item{padding:14px 24px;display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:500;color:var(--text);border-left:4px solid transparent;transition:.15s}
    .menu-item:hover{background:var(--bg);border-left-color:var(--primary)}
    .menu-item.active{background:var(--primary);color:#fff;border-left-color:var(--accent)}
    .menu-item .emoji{font-size:1.2rem}
    .theme-switch{display:flex;align-items:center;margin:20px 24px;gap:12px;color:var(--text)}
    .main-content{flex:1;margin-left:0;transition:margin-left .2s;width:100%}
    .app-header{background:linear-gradient(135deg,#2ab5b2,#1a8a87);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(42,181,178,.3);flex-wrap:wrap;gap:12px}
    .app-header h1{color:#fff;font-family:'Space Mono',monospace;font-size:1.4rem;letter-spacing:-0.5px}
    .btn-pdf-sm{padding:8px 16px;font-size:.8rem}
    .content{max-width:1280px;margin:0 auto;padding:24px 20px}
    .section-title{font-family:'Space Mono',monospace;font-size:1.05rem;color:var(--primary-dark);margin:24px 0 16px;padding-bottom:8px;border-bottom:3px solid var(--primary);display:flex;align-items:center;justify-content:space-between}
    .card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border-left:4px solid var(--primary);transition:transform .15s}
    .grid{display:grid;gap:12px}
    .grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr 1fr}.grid-4{grid-template-columns:1fr 1fr 1fr 1fr}
    @media(max-width:768px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
    .field{display:flex;flex-direction:column;gap:4px}
    .field label{font-size:.75rem;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px}
    .field input,.field select{padding:10px 12px;border:2px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.92rem;background:var(--card);color:var(--text);transition:.2s}
    .field input:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(42,181,178,.15)}
    .field input[readonly]{background:rgba(42,181,178,0.1);color:var(--primary-dark);font-weight:600;border-color:var(--primary)}
    .btn{padding:10px 20px;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:.2s;font-size:.85rem;display:inline-flex;align-items:center;gap:8px}
    .btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
    .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin:16px 0}
    .summary-box{background:var(--card);border-radius:var(--radius);padding:18px;text-align:center;box-shadow:var(--shadow);border-top:4px solid var(--primary)}
    .summary-box .value{font-family:'Space Mono',monospace;font-size:1.3rem;font-weight:700;margin-top:4px}
    .chart-container{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);height:300px;display:flex;justify-content:center;align-items:center}
    .chart-small{height:220px}
    .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
    .badge-success{background:#c6f6d5;color:#276749}.badge-danger{background:#fed7d7;color:#9b2c2c}
    .compare-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
    .hidden{display:none !important}
    .dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:16px}
    .integrated-value{font-size:1.6rem;font-family:'Space Mono',monospace;color:var(--primary)}
    .error-message{color:var(--danger);font-size:.75rem;margin-top:2px}
  </style>
</head>
<body>
<div class="app-wrapper">
  <!-- Menu lateral retrátil -->
  <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
  <div class="side-menu" id="sideMenu">
    <div class="menu-header"><h2>📋 Navegação</h2></div>
    <div class="menu-item active" data-tab="0"><span class="emoji">📋</span> Plano Ideal</div>
    <div class="menu-item" data-tab="1"><span class="emoji">📊</span> Plano Real</div>
    <div class="menu-item" data-tab="6"><span class="emoji">🏠</span> Painel Principal</div>
    <div class="menu-item" data-tab="2"><span class="emoji">⚖️</span> Comparativo</div>
    <div class="menu-item" data-tab="3"><span class="emoji">🔍</span> Análise</div>
    <div class="menu-item" data-tab="4"><span class="emoji">🎯</span> Caixinhas</div>
    <div class="menu-item" data-tab="5"><span class="emoji">🧮</span> Simulador</div>
    <div class="theme-switch">
      <span>🌙 Tema Escuro</span>
      <input type="checkbox" id="darkToggle" style="width:20px;height:20px;">
    </div>
  </div>

  <div class="main-content">
    <div class="app-header">
      <h1>💰 Planejador Financeiro Pro</h1>
      <button class="btn btn-pdf btn-pdf-sm" onclick="exportPDF()">📄 Gerar Relatório PDF</button>
    </div>

    <div class="content">
      <!-- Abas de conteúdo -->
      <div class="tab-content" id="tab0">
        <div class="summary-grid" id="ideal-summary"></div>
        <div class="section-title"><div><span>💰 Salários & Deduções</span></div></div>
        <div class="card">
          <div class="grid grid-4">
            <div class="field"><label>Salário Bruto</label><input type="text" data-field="i_sal" data-type="money" placeholder="R$ 0,00"></div>
            <div class="field"><label>Dependentes</label><input type="number" data-field="i_dep" value="0" min="0"></div>
            <div class="field"><label>Pensão</label><input type="text" data-field="i_pensao" data-type="money" placeholder="R$ 0,00"></div>
            <div class="field"><label>Salário Líquido</label><input type="text" id="i_sal_liq" readonly></div>
          </div>
          <div class="grid grid-3" style="margin-top:10px">
            <div class="field"><label>INSS</label><input type="text" id="i_sal_inss" readonly></div>
            <div class="field"><label>IRRF</label><input type="text" id="i_sal_irrf" readonly></div>
            <div class="field"><label>Vale-Alimentação</label><input type="text" data-field="i_va" data-type="money" placeholder="R$ 0,00"></div>
          </div>
        </div>
        <div class="section-title"><div><span>📤 Gastos</span></div></div>
        <div class="grid grid-2">
          <div class="card">
            <div class="grid grid-2">
              <div class="field"><label>Aluguel/Financ</label><input type="text" data-field="i_aluguel" data-type="money"></div>
              <div class="field"><label>Mercado</label><input type="text" data-field="i_mercado" data-type="money"></div>
              <div class="field"><label>Contas</label><input type="text" data-field="i_contas" data-type="money"></div>
              <div class="field"><label>Transporte</label><input type="text" data-field="i_transp" data-type="money"></div>
              <div class="field"><label>Faxina 🧹</label><input type="text" data-field="i_faxina" data-type="money"></div>
            </div>
          </div>
          <div class="chart-container"><canvas id="idealChart"></canvas></div>
        </div>
      </div>

      <div class="tab-content hidden" id="tab1">
        <div class="summary-grid" id="real-summary"></div>
        <div class="section-title"><span>💰 Salários — Real</span></div>
        <div class="card">
          <div class="grid grid-4">
            <div class="field"><label>Salário Bruto</label><input type="text" data-field="r_sal" data-type="money"></div>
            <div class="field"><label>Dependentes</label><input type="number" data-field="r_dep" value="0" min="0"></div>
            <div class="field"><label>Pensão</label><input type="text" data-field="r_pensao" data-type="money"></div>
            <div class="field"><label>Salário Líquido</label><input type="text" id="r_sal_liq" readonly></div>
          </div>
        </div>
        <div class="grid grid-2">
          <div class="card">
            <div class="grid grid-2">
              <div class="field"><label>Aluguel</label><input type="text" data-field="r_aluguel" data-type="money"></div>
              <div class="field"><label>Mercado</label><input type="text" data-field="r_mercado" data-type="money"></div>
              <div class="field"><label>Contas</label><input type="text" data-field="r_contas" data-type="money"></div>
              <div class="field"><label>Transporte</label><input type="text" data-field="r_transp" data-type="money"></div>
              <div class="field"><label>Faxina</label><input type="text" data-field="r_faxina" data-type="money"></div>
            </div>
          </div>
          <div class="chart-container"><canvas id="realChart"></canvas></div>
        </div>
      </div>

      <!-- NOVA ABA: Painel Principal com todos os gráficos e integração -->
      <div class="tab-content hidden" id="tab6">
        <div class="section-title">📊 Painel Resumo — Gráficos Integrados</div>
        <div class="dashboard-grid">
          <div class="card" style="grid-column:span 2">
            <h3>Saldo Plano Real (integrado ao Simulador) </h3>
            <div class="integrated-value" id="integrated-saldo-real">R$ 0,00</div>
            <button class="btn btn-primary" style="margin-top:12px" onclick="usarSaldoRealNoSimulador()">➡️ Usar saldo real como aporte inicial</button>
          </div>
        </div>
        <div class="grid grid-2">
          <div class="chart-container"><canvas id="dashboardIdealChart"></canvas></div>
          <div class="chart-container"><canvas id="dashboardRealChart"></canvas></div>
        </div>
        <div class="chart-container"><canvas id="dashboardSimChart"></canvas></div>
        <div id="compare-resume" class="card"></div>
      </div>

      <div class="tab-content hidden" id="tab2"><div id="compare-table"></div></div>
      <div class="tab-content hidden" id="tab3">
        <div class="card"><div id="analysis-bad"></div><div id="analysis-good"></div></div>
      </div>
      <div class="tab-content hidden" id="tab5">
        <div class="card">
          <div class="grid grid-3">
            <div class="field"><label>Investimento Inicial</label><input type="text" id="sim_inicial" data-type="money" value="R$ 0,00"></div>
            <div class="field"><label>Aporte Mensal</label><input type="text" id="sim_aporte" data-type="money" value="R$ 0,00"></div>
            <div class="field"><label>Taxa % a.m.</label><input type="number" id="sim_taxa" step="0.1" min="0"></div>
          </div>
          <button class="btn btn-primary" onclick="runSim()">Simular</button>
        </div>
        <div class="chart-container"><canvas id="simChart"></canvas></div>
      </div>
    </div>
  </div>
</div>

<script>
  (function(){
    const D = { i_dep:0, r_dep:0 };
    let charts = {};
    const fmt = v => 'R$ ' + (v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
    const parseMoney = s => { if(!s) return 0; return parseFloat(s.toString().replace(/[R$\s.]/g,'').replace(',','.')) || 0; };

    // Validações negativas
    function validarNumero(el){
      let val = parseMoney(el.value);
      if(val < 0){ el.value = fmt(0); alert('Valores negativos não são permitidos.'); }
    }

    function moneyMask(el) {
      let raw = el.value.replace(/\D/g, '');
      let num = parseInt(raw || '0') / 100;
      if(num < 0) num = 0;
      el.value = fmt(num);
    }

    document.addEventListener('input', e => {
      const el = e.target;
      if (el.dataset.type === 'money') { moneyMask(el); validarNumero(el); }
      const k = el.dataset.field || el.id;
      if (k) { D[k] = el.dataset.type === 'money' ? parseMoney(el.value) : el.value; }
      recalc();
    });

    function showTab(n) {
      document.querySelectorAll('.tab-content').forEach((t,i)=> t.classList.toggle('hidden', i!==n));
      document.querySelectorAll('.menu-item').forEach((m,i)=> {
        m.classList.toggle('active', m.dataset.tab == n);
      });
      if(n===6) atualizarPainelPrincipal();
    }

    // Menu lateral
    const menu = document.getElementById('sideMenu');
    const toggle = document.getElementById('menuToggle');
    toggle.addEventListener('click', ()=> menu.classList.toggle('open'));
    document.querySelectorAll('.menu-item').forEach(item => item.addEventListener('click', (e)=>{
      const tab = parseInt(item.dataset.tab);
      showTab(tab);
      if(window.innerWidth<768) menu.classList.remove('open');
    }));

    // Dark theme
    const darkToggle = document.getElementById('darkToggle');
    darkToggle.addEventListener('change', ()=> document.body.classList.toggle('dark', darkToggle.checked));

    // Cálculos
    function calcINSS(b) { if(b<=1412) return b*0.075; if(b<=2666.68) return b*0.09-21.18; if(b<=4000.03) return b*0.12-101.18; if(b<=7786.02) return b*0.14-181.18; return 908.85; }
    function calcIRRF(bruto, inss, dep=0, pensao=0) {
      const deducao = dep*189.59; const base = bruto - inss - deducao - pensao;
      if(base<=2259.20) return 0; if(base<=2826.65) return base*0.075-169.44;
      if(base<=3751.05) return base*0.15-381.44; if(base<=4664.68) return base*0.225-662.77;
      return base*0.275-896.00;
    }

    function updateSalaries(p) {
      const bruto = D[p+'_sal'] || 0; const dep = parseInt(D[p+'_dep']||0); const pensao = D[p+'_pensao']||0;
      const inss = calcINSS(bruto); const irrf = calcIRRF(bruto, inss, dep, pensao);
      const liq = bruto - inss - irrf;
      document.getElementById(p+'_sal_inss') && (document.getElementById(p+'_sal_inss').value = fmt(inss));
      document.getElementById(p+'_sal_irrf') && (document.getElementById(p+'_sal_irrf').value = fmt(irrf));
      document.getElementById(p+'_sal_liq') && (document.getElementById(p+'_sal_liq').value = fmt(liq));
      return liq;
    }

    function updateCharts(p, data) {
      const id = p==='i'?'idealChart':'realChart';
      const ctx = document.getElementById(id)?.getContext('2d');
      if(!ctx) return;
      if(charts[p]) charts[p].destroy();
      charts[p] = new Chart(ctx, { type:'doughnut', data:{ labels:['Aluguel','Mercado','Contas','Transporte','Faxina','Investimento'], datasets:[{ data:[data.aluguel, data.mercado, data.contas, data.transp, data.faxina, Math.max(0,data.saldo)], backgroundColor:['#f06868','#f5a623','#4a90d9','#805ad5','#a0aec0','#48bb78'] }] }, options:{responsive:true, maintainAspectRatio:false} });
    }

    function recalc() {
      ['i','r'].forEach(p => {
        const liq = updateSalaries(p);
        const gastos = (D[p+'_aluguel']||0)+(D[p+'_mercado']||0)+(D[p+'_contas']||0)+(D[p+'_transp']||0)+(D[p+'_faxina']||0);
        const saldo = liq - gastos;
        const summary = document.getElementById(p+'-summary');
        if(summary) summary.innerHTML = `<div class="summary-box"><div>Renda Líquida</div><div class="value">${fmt(liq)}</div></div><div class="summary-box"><div>Gastos</div><div class="value">${fmt(gastos)}</div></div><div class="summary-box"><div>Sobra</div><div class="value">${fmt(saldo)}</div></div>`;
        updateCharts(p, {aluguel:D[p+'_aluguel'], mercado:D[p+'_mercado'], contas:D[p+'_contas'], transp:D[p+'_transp'], faxina:D[p+'_faxina'], saldo});
      });
      atualizarComparativo();
    }

    function atualizarPainelPrincipal() {
      const saldoReal = parseMoney(document.getElementById('r_sal_liq')?.value) - ((D.r_aluguel||0)+(D.r_mercado||0)+(D.r_contas||0)+(D.r_transp||0)+(D.r_faxina||0));
      document.getElementById('integrated-saldo-real').innerText = fmt(saldoReal);
      // Gráficos do painel
      ['ideal','real'].forEach(t=> {
        const canvas = document.getElementById(`dashboard${t.charAt(0).toUpperCase()+t.slice(1)}Chart`);
        if(canvas){
          const ctx = canvas.getContext('2d');
          const prefix = t==='ideal'?'i':'r';
          const liq = parseMoney(document.getElementById(prefix+'_sal_liq')?.value);
          const gastos = (D[prefix+'_aluguel']||0)+(D[prefix+'_mercado']||0)+(D[prefix+'_contas']||0)+(D[prefix+'_transp']||0)+(D[prefix+'_faxina']||0);
          const saldo = liq - gastos;
          if(window[`dashChart${t}`]) window[`dashChart${t}`].destroy();
          window[`dashChart${t}`] = new Chart(ctx, {type:'doughnut', data:{ labels:['Aluguel','Mercado','Contas','Transporte','Faxina','Sobra'], datasets:[{data:[D[prefix+'_aluguel'],D[prefix+'_mercado'],D[prefix+'_contas'],D[prefix+'_transp'],D[prefix+'_faxina'], saldo], backgroundColor:['#f06868','#f5a623','#4a90d9','#805ad5','#a0aec0','#48bb78']}]}});
        }
      });
      runSimDashboard();
    }

    function runSimDashboard() {
      const ini = parseMoney(document.getElementById('sim_inicial')?.value)||0;
      const ap = parseMoney(document.getElementById('sim_aporte')?.value)||0;
      const taxa = (parseFloat(document.getElementById('sim_taxa')?.value)||0)/100;
      let saldo = ini; let vals=[];
      for(let i=0;i<=12;i++){ vals.push(saldo); saldo = (saldo+ap)*(1+taxa); }
      const ctx = document.getElementById('dashboardSimChart')?.getContext('2d');
      if(ctx){
        if(window.dashSim) window.dashSim.destroy();
        window.dashSim = new Chart(ctx, {type:'line', data:{labels:[...Array(13).keys()].map(i=>'Mês '+i), datasets:[{label:'Simulação',data:vals,borderColor:'#2ab5b2'}]}});
      }
    }

    window.usarSaldoRealNoSimulador = function(){
      const saldoReal = parseMoney(document.getElementById('r_sal_liq')?.value) - ((D.r_aluguel||0)+(D.r_mercado||0)+(D.r_contas||0)+(D.r_transp||0)+(D.r_faxina||0));
      document.getElementById('sim_inicial').value = fmt(saldoReal);
      showTab(5);
    }

    window.runSim = function(){
      const ini = parseMoney(document.getElementById('sim_inicial').value);
      const ap = parseMoney(document.getElementById('sim_aporte').value);
      const taxa = parseFloat(document.getElementById('sim_taxa').value)/100;
      let saldo = ini; let vals=[];
      for(let i=0;i<=12;i++){ vals.push(saldo); saldo = (saldo+ap)*(1+taxa); }
      const ctx = document.getElementById('simChart').getContext('2d');
      if(charts.sim) charts.sim.destroy();
      charts.sim = new Chart(ctx, {type:'line', data:{labels:[...Array(13).keys()].map(i=>'Mês '+i), datasets:[{label:'Patrimônio',data:vals,borderColor:'#2ab5b2',tension:0.3}]}});
    }

    function atualizarComparativo(){
      const cmp = document.getElementById('compare-table');
      if(cmp) cmp.innerHTML = `<div class="compare-row"><span>Categoria</span><span>Ideal</span><span>Real</span></div>
        ${['Aluguel','Mercado','Contas','Transporte','Faxina','Sobra'].map(cat=>{
          let ideal=0, real=0;
          if(cat==='Sobra'){ ideal = parseMoney(document.getElementById('i_sal_liq')?.value)-((D.i_aluguel||0)+(D.i_mercado||0)+(D.i_contas||0)+(D.i_transp||0)+(D.i_faxina||0)); real = parseMoney(document.getElementById('r_sal_liq')?.value)-((D.r_aluguel||0)+(D.r_mercado||0)+(D.r_contas||0)+(D.r_transp||0)+(D.r_faxina||0)); }
          else { const k = cat.toLowerCase(); ideal = D['i_'+k]||0; real = D['r_'+k]||0; }
          return `<div class="compare-row"><span>${cat}</span><span>${fmt(ideal)}</span><span>${fmt(real)}</span></div>`;
        }).join('')}`;
    }

    window.exportPDF = function(){
      const { jsPDF } = window.jspdf; const doc = new jsPDF();
      doc.text("Relatório Financeiro",20,20);
      doc.autoTable({ head:[['Categoria','Ideal','Real']], body:[ ['Saldo Líquido', document.getElementById('i_sal_liq')?.value, document.getElementById('r_sal_liq')?.value], ['Mercado',fmt(D.i_mercado),fmt(D.r_mercado)], ['Faxina',fmt(D.i_faxina),fmt(D.r_faxina)] ] });
      doc.save('planejamento.pdf');
    }

    window.onload = ()=>{
      recalc(); showTab(0);
    };
  })();
</script>
